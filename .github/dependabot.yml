version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Asia/Seoul
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
      time: "10:00"
      timezone: Asia/Seoul
    # Tauri's GTK 3 stack requires glib 0.18; the fix requires glib >=0.20.
    # Remove this exception once the upstream stack supports a fixed release.
    ignore:
      - dependency-name: glib
    # Keep other security updates enabled without adding routine version PRs.
    open-pull-requests-limit: 0
