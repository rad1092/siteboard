name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      full_native:
        description: Run the full native build and smoke checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 15
    outputs:
      native: ${{ steps.changes.outputs.native }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect native changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_NATIVE: ${{ inputs.full_native }}
        run: |
          if [ "$FULL_NATIVE" = "true" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$BASE_SHA" ]; then
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
            if grep -Eq '^(src-tauri/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
              echo "native=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies before builds
        run: npm audit --audit-level=high

      - name: Verify
        run: |
          npm test
          npm run lint
          npm run build:web

  desktop-smoke:
    needs: verify
    if: needs.verify.outputs.native == 'true'
    timeout-minutes: 45
    name: Desktop smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs with native changes check Linux; manual full runs cover all platforms.
        os: ${{ fromJSON(inputs.full_native && '["macos-15","windows-2025","ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test desktop persistence
        run: npm run desktop:test

      - name: Build desktop application
        run: npm run desktop:build:debug
