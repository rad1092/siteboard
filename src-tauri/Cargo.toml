[package]
name = "siteboard"
version = "5.0.0"
description = "A local-first website studio"
authors = ["WHAGO"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "siteboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

